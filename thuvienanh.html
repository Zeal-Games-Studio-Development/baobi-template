<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thư Viện Ảnh - Bao Bì Bảo Tín</title>
    <meta name="base-path" content="">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phonering_gotop.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { background:linear-gradient(135deg,#0b4a8e,#083875); padding:40px 0; color:#fff; text-align:center; }
        .page-hero h1 { font-size:32px; font-weight:900; }
        .breadcrumb { background:transparent; justify-content:center; padding:0; font-size:14px; }
        .breadcrumb-item a { color:rgba(255,255,255,0.75); }
        .breadcrumb-item.active { color:#fff; }
        .breadcrumb-item+.breadcrumb-item::before { color:rgba(255,255,255,0.5); }
        .gallery-item { position:relative; overflow:hidden; border-radius:4px; cursor:pointer; aspect-ratio:1; background:#eee; }
        .gallery-item img { width:100%; height:100%; object-fit:cover; transition:transform 0.4s; }
        .gallery-item:hover img { transform:scale(1.08); }
        .gallery-item .overlay { position:absolute; inset:0; background:rgba(11,74,142,0.0); display:flex; align-items:center; justify-content:center; transition:background 0.3s; }
        .gallery-item:hover .overlay { background:rgba(11,74,142,0.5); }
        .gallery-item .overlay i { color:#fff; font-size:28px; opacity:0; transition:opacity 0.3s; }
        .gallery-item:hover .overlay i { opacity:1; }
        .filter-bar { padding:16px 0; border-bottom:1px solid #ddd; margin-bottom:24px; }
        .filter-btn { margin:4px; font-size:13px; }
        /* Lightbox */
        #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; }
        #lightbox.active { display:flex; }
        #lightbox img { max-width:90%; max-height:90vh; object-fit:contain; border-radius:4px; }
        #lightbox .close-btn { position:absolute; top:20px; right:24px; color:#fff; font-size:36px; cursor:pointer; line-height:1; }
        #lightbox .prev-btn, #lightbox .next-btn { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:36px; cursor:pointer; padding:10px 16px; background:rgba(255,255,255,0.1); border-radius:4px; }
        #lightbox .prev-btn { left:16px; }
        #lightbox .next-btn { right:16px; }
    </style>
</head>
<body>
<div class="page-hero">
    <div class="container">
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li><li class="breadcrumb-item active">Thư Viện Ảnh</li></ol></nav>
        <h1>THƯ VIỆN ẢNH</h1>
        <p style="color:rgba(255,255,255,0.85);">Hình ảnh sản phẩm và quy trình sản xuất của Bao Bì Bảo Tín</p>
    </div>
</div>

<section class="py-5">
    <div class="container">
        <div class="filter-bar">
            <button class="btn btn-primary filter-btn active" data-cat="all">Tất cả</button>
            <button class="btn btn-outline-primary filter-btn" data-cat="ong-giay">Ống Giấy</button>
            <button class="btn btn-outline-primary filter-btn" data-cat="thanh-v">Thanh V</button>
            <button class="btn btn-outline-primary filter-btn" data-cat="bao-bi">Bao Bì Giấy</button>
            <button class="btn btn-outline-primary filter-btn" data-cat="carton">Thùng Carton</button>
        </div>
        <div class="row" id="galleryGrid"></div>
    </div>
</section>

<!-- Lightbox -->
<div id="lightbox">
    <span class="close-btn" id="lbClose">&times;</span>
    <span class="prev-btn" id="lbPrev">&#10094;</span>
    <img src="" id="lbImg" alt="">
    <span class="next-btn" id="lbNext">&#10095;</span>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="script.js"></script>
<script src="includes/data.js"></script>
<script>
// Gallery items with category tags
var galleryItems = [
    {src:'sp-ong-giay-1.jpg',cat:'ong-giay',label:'Ống Giấy'},
    {src:'sp-ong-giay-2.jpg',cat:'ong-giay',label:'Ống Giấy'},
    {src:'sp-ong-giay-3.jpg',cat:'ong-giay',label:'Ống Giấy'},
    {src:'sp-ong-giay-4.jpg',cat:'ong-giay',label:'Ống Giấy'},
    {src:'g5.jpg',cat:'ong-giay',label:'Ống Giấy'},
    {src:'sp-thanh-v-1.jpg',cat:'thanh-v',label:'Thanh V'},
    {src:'sp-thanh-v-2.jpg',cat:'thanh-v',label:'Thanh V'},
    {src:'sp-thanh-v-3.jpg',cat:'thanh-v',label:'Thanh V'},
    {src:'sp-thanh-v-4.jpg',cat:'thanh-v',label:'Thanh V'},
    {src:'t5.jpg',cat:'thanh-v',label:'Thanh V'},
    {src:'thanh-V.jpg',cat:'thanh-v',label:'Thanh V Nẹp Giấy'},
    {src:'thanh-v2.jpg',cat:'thanh-v',label:'Thanh V Nẹp Giấy'},
    {src:'duoc-pham-1.jpg',cat:'bao-bi',label:'Bao Bì Dược Phẩm'},
    {src:'duoc-pham-2.jpg',cat:'bao-bi',label:'Bao Bì Dược Phẩm'},
    {src:'duoc-pham-3.jpg',cat:'bao-bi',label:'Bao Bì Dược Phẩm'},
    {src:'duoc-pham-4.jpg',cat:'bao-bi',label:'Bao Bì Dược Phẩm'},
    {src:'duoc-pham-5.jpg',cat:'bao-bi',label:'Bao Bì Dược Phẩm'},
    {src:'my-pham-1.jpg',cat:'bao-bi',label:'Bao Bì Mỹ Phẩm'},
    {src:'my-pham-2.jpg',cat:'bao-bi',label:'Bao Bì Mỹ Phẩm'},
    {src:'my-pham-3.jpg',cat:'bao-bi',label:'Bao Bì Mỹ Phẩm'},
    {src:'my-pham-4.jpg',cat:'bao-bi',label:'Bao Bì Mỹ Phẩm'},
    {src:'my-pham-5.jpg',cat:'bao-bi',label:'Bao Bì Mỹ Phẩm'},
    {src:'giay-da-1.jpg',cat:'bao-bi',label:'Bao Bì Giày Da'},
    {src:'giay-da-2.jpg',cat:'bao-bi',label:'Bao Bì Giày Da'},
    {src:'giay-da-3.jpg',cat:'bao-bi',label:'Bao Bì Giày Da'},
    {src:'giay-da-4.jpg',cat:'bao-bi',label:'Bao Bì Giày Da'},
    {src:'may-mac-1.jpg',cat:'bao-bi',label:'Bao Bì May Mặc'},
    {src:'may-mac-2.jpg',cat:'bao-bi',label:'Bao Bì May Mặc'},
    {src:'may-mac-3.jpg',cat:'bao-bi',label:'Bao Bì May Mặc'},
    {src:'may-mac-4.jpg',cat:'bao-bi',label:'Bao Bì May Mặc'},
    {src:'may-mac-5.jpg',cat:'bao-bi',label:'Bao Bì May Mặc'},
    {src:'carton-1.jpg',cat:'carton',label:'Thùng Carton'},
    {src:'carton-3.jpg',cat:'carton',label:'Thùng Carton'},
    {src:'carton-4.jpg',cat:'carton',label:'Thùng Carton'},
    {src:'carton-5.jpg',cat:'carton',label:'Thùng Carton'},
    {src:'offset-1.jpg',cat:'carton',label:'Thùng Carton In Offset'},
    {src:'offset-2.jpg',cat:'carton',label:'Thùng Carton In Offset'},
    {src:'offset-3.jpg',cat:'carton',label:'Thùng Carton In Offset'},
    {src:'offset-4.jpg',cat:'carton',label:'Thùng Carton In Offset'},
    {src:'about-img.jpg',cat:'all',label:'Bao Bì Bảo Tín'}
];

var currentCat = 'all';
var visibleItems = [];
var currentIdx = 0;

function renderGallery(cat) {
    visibleItems = cat === 'all' ? galleryItems : galleryItems.filter(function(i){return i.cat===cat||i.cat==='all';});
    var html = '';
    visibleItems.forEach(function(item, idx) {
        html += '<div class="col-6 col-md-3 col-lg-3 mb-3">'
            + '<div class="gallery-item" data-idx="'+idx+'">'
            + '<img src="images/'+item.src+'" alt="'+item.label+'" loading="lazy">'
            + '<div class="overlay"><i class="fas fa-search-plus"></i></div>'
            + '</div></div>';
    });
    document.getElementById('galleryGrid').innerHTML = html;
    document.querySelectorAll('.gallery-item').forEach(function(el){
        el.addEventListener('click', function(){
            currentIdx = parseInt(this.getAttribute('data-idx'));
            openLightbox(currentIdx);
        });
    });
}

function openLightbox(idx) {
    document.getElementById('lbImg').src = 'images/' + visibleItems[idx].src;
    document.getElementById('lightbox').classList.add('active');
}

document.getElementById('lbClose').addEventListener('click', function(){
    document.getElementById('lightbox').classList.remove('active');
});
document.getElementById('lbPrev').addEventListener('click', function(){
    currentIdx = (currentIdx - 1 + visibleItems.length) % visibleItems.length;
    openLightbox(currentIdx);
});
document.getElementById('lbNext').addEventListener('click', function(){
    currentIdx = (currentIdx + 1) % visibleItems.length;
    openLightbox(currentIdx);
});

document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active','btn-primary'); b.classList.add('btn-outline-primary'); });
        this.classList.add('active','btn-primary'); this.classList.remove('btn-outline-primary');
        currentCat = this.getAttribute('data-cat');
        renderGallery(currentCat);
    });
});

renderGallery('all');
</script>
<script src="includes/nav.js"></script>
</body>
</html>
