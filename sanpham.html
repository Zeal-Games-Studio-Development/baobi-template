<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Chi Tiết Sản Phẩm - Bao Bì Bảo Tín</title>
    <meta name="base-path" content="">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phonering_gotop.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-img { width:100%; max-height:480px; object-fit:cover; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,0.15); }
        .breadcrumb { background:transparent; padding:12px 0 4px; font-size:14px; }
        .breadcrumb-item a { color:#0b4a8e; }
        .breadcrumb-item.active { color:#666; }
        .product-title { font-size:28px; font-weight:900; color:#0b4a8e; margin-bottom:12px; }
        .price-box { background:#f8f8f8; border:2px dashed #e31e24; border-radius:6px; padding:16px 20px; margin:18px 0; }
        .price-label { font-size:15px; color:#666; }
        .price-value { font-size:22px; font-weight:900; color:#e31e24; }
        .contact-buttons a { margin-right:10px; margin-bottom:10px; font-weight:700; min-width:160px; }
        .product-info-table td { padding:8px 12px; border-bottom:1px solid #eee; font-size:14px; }
        .product-info-table td:first-child { font-weight:700; color:#555; width:140px; }
        .related-section { background:#f5f5f5; padding:40px 0; margin-top:40px; }
        .page-hero { background:linear-gradient(135deg,#0b4a8e,#083875); color:#fff; padding:30px 0 20px; }
        .page-hero h1 { font-size:20px; font-weight:700; margin:0; }
    </style>
</head>
<body>
<div class="page-hero">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1" style="background:transparent;padding:0;">
                <li class="breadcrumb-item"><a href="index.html" style="color:rgba(255,255,255,0.7)">Trang chủ</a></li>
                <li class="breadcrumb-item" id="breadCat"><a href="#" style="color:rgba(255,255,255,0.7)">Danh mục</a></li>
                <li class="breadcrumb-item active" id="breadName" style="color:#fff">Sản phẩm</li>
            </ol>
        </nav>
        <h1 id="pageTitle">Chi Tiết Sản Phẩm</h1>
    </div>
</div>

<section class="py-5">
    <div class="container">
        <div class="row" id="productContent">
            <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</section>

<section class="related-section">
    <div class="container">
        <h2 class="section-heading red text-center mb-4">SẢN PHẨM LIÊN QUAN</h2>
        <div class="row" id="relatedProducts"></div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="script.js"></script>
<script src="includes/data.js"></script>
<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var p = PRODUCTS[id];

    if (!p) {
        document.getElementById('productContent').innerHTML = '<div class="col-12 text-center py-5"><h4>Không tìm thấy sản phẩm.</h4><a href="index.html" class="btn btn-primary mt-3">Về trang chủ</a></div>';
        return;
    }

    document.title = p.name + ' - Bao Bì Bảo Tín';
    document.getElementById('pageTitle').textContent = p.name;

    var catUrl = p.cat + '.html';
    var catEl = document.getElementById('breadCat');
    catEl.innerHTML = '<a href="' + catUrl + '" style="color:rgba(255,255,255,0.7)">' + p.catName + '</a>';
    document.getElementById('breadName').textContent = p.name;

    document.getElementById('productContent').innerHTML = `
        <div class="col-md-6 mb-4">
            <img src="images/${p.img}" alt="${p.name}" class="product-detail-img">
        </div>
        <div class="col-md-6">
            <h1 class="product-title">${p.name}</h1>
            <p class="text-muted" style="font-size:14px;"><i class="fas fa-tag mr-1"></i> Danh mục: <a href="${catUrl}">${p.catName}</a></p>
            <div class="price-box">
                <div class="price-label">Giá bán lẻ</div>
                <div class="price-value">Liên hệ để báo giá</div>
            </div>
            <p style="line-height:1.8;">${p.desc}</p>
            <table class="table product-info-table mb-4">
                <tr><td>Mã sản phẩm</td><td>#${p.id}</td></tr>
                <tr><td>Danh mục</td><td>${p.catName}</td></tr>
                <tr><td>Xuất xứ</td><td>Việt Nam</td></tr>
                <tr><td>Đặt hàng tối thiểu</td><td>Liên hệ</td></tr>
                <tr><td>Giao hàng</td><td>Toàn quốc</td></tr>
            </table>
            <div class="contact-buttons">
                <a href="tel:02862700378" class="btn btn-danger btn-lg"><i class="fas fa-phone mr-2"></i>028 6270 0378</a>
                <a href="tel:0977307761" class="btn btn-primary btn-lg"><i class="fas fa-phone-volume mr-2"></i>0977 307 761</a>
                <a href="https://zalo.me/0977307761" class="btn btn-info btn-lg" target="_blank" style="background:#0068ff;border-color:#0068ff;"><i class="fas fa-comment mr-2"></i>Chat Zalo</a>
                <a href="lienhe.html" class="btn btn-outline-secondary btn-lg mt-2"><i class="fas fa-envelope mr-2"></i>Gửi yêu cầu</a>
            </div>
        </div>`;

    // Related products (same category, different id)
    var related = Object.values(PRODUCTS).filter(function(q){ return q.cat === p.cat && q.id !== p.id; }).slice(0,4);
    var html = '';
    related.forEach(function(r){
        html += `<div class="col-6 col-md-3 mb-4">
            <div class="product-card bordered">
                <a href="sanpham.html?id=${r.id}"><img src="images/${r.img}" alt="${r.name}" style="height:180px;object-fit:cover;width:100%;"></a>
                <div class="product-info">
                    <p class="product-name"><a href="sanpham.html?id=${r.id}">${r.name}</a></p>
                    <p class="product-price"><a href="sanpham.html?id=${r.id}"><strong>Liên hệ</strong></a> / Giá</p>
                </div>
            </div>
        </div>`;
    });
    document.getElementById('relatedProducts').innerHTML = html;
})();
</script>
<script src="includes/nav.js"></script>
</body>
</html>
