<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title id="pageTitle">Sản Phẩm - Bao Bì Bảo Tín</title>
    <meta name="base-path" content="">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phonering_gotop.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { padding: 40px 0; }
        .page-hero.blue { background: linear-gradient(135deg, #0b4a8e, #083875); }
        .page-hero.white { background: #f5f5f5; border-bottom: 3px solid #0b4a8e; }
        .page-hero h1 { font-size: 32px; font-weight: 900; text-transform: uppercase; }
        .page-hero p { font-size: 16px; max-width: 700px; margin: 10px auto 0; }
        .breadcrumb { background: transparent; padding: 0; font-size: 14px; justify-content: center; }
        .breadcrumb-item a { color: rgba(255,255,255,0.75); }
        .breadcrumb-item.active { color: #fff; }
        .breadcrumb-item + .breadcrumb-item::before { color: rgba(255,255,255,0.5); }
        .page-hero.white .breadcrumb-item a { color: #0b4a8e; }
        .page-hero.white .breadcrumb-item.active { color: #555; }
        .page-hero.white .breadcrumb-item + .breadcrumb-item::before { color: #999; }
        .page-hero.white h1 { color: #0b4a8e; }
        .page-hero.white p { color: #555; }
        .cat-section { padding: 50px 0; }
        .product-count { font-size: 14px; color: #888; margin-bottom: 24px; }
    </style>
</head>
<body>
<!-- Page Hero - filled by JS -->
<div id="pageHero"></div>

<!-- Products Grid -->
<section class="cat-section">
    <div class="container">
        <p class="product-count" id="productCount"></p>
        <div class="row" id="productsGrid"></div>
    </div>
</section>

<!-- CTA Section -->
<section class="py-5" style="background:#f5f5f5; border-top:1px solid #ddd;">
    <div class="container text-center">
        <h3 style="color:#0b4a8e; font-weight:900;">BẠN CẦN BÁO GIÁ?</h3>
        <p class="text-muted">Liên hệ ngay với chúng tôi để được tư vấn và nhận báo giá tốt nhất</p>
        <a href="tel:0977307761" class="btn btn-danger btn-lg mr-3"><i class="fas fa-phone mr-2"></i>0977 307 761</a>
        <a href="lienhe.html" class="btn btn-outline-primary btn-lg"><i class="fas fa-envelope mr-2"></i>Gửi yêu cầu</a>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="script.js"></script>
<script src="includes/data.js"></script>
<script>
(function () {
    // Determine which category from filename
    var page = window.location.pathname.split('/').pop();
    var catMap = {
        'ong-giay-thanh-v.html': {
            key: 'ong-giay-thanh-v',
            title: 'Ống Giấy, Thanh V',
            desc: 'Các loại ống giấy và thanh V của chúng tôi có độ cứng cáp đạt tiêu chuẩn, bền hơn và tiện lợi hơn với quy cách đa dạng, phục vụ cho nhiều ngành sản xuất.',
            heroClass: 'blue',
            img: 'images/cat-ong-giay.png'
        },
        'bao-bi-giay.html': {
            key: 'bao-bi-giay',
            title: 'Bao Bì Giấy',
            desc: 'Chúng tôi nhận sản xuất bao bì giấy in ấn theo yêu cầu với chất lượng in sắc nét, áp dụng những công nghệ sản xuất hiện đại nhất để cho ra sản phẩm đồng đều chất lượng.',
            heroClass: 'white',
            img: 'images/cat-bao-bi-giay.png'
        },
        'thung-carton.html': {
            key: 'thung-carton',
            title: 'Thùng Carton',
            desc: 'Chúng tôi cam kết luôn sản xuất đúng tiến độ, đảm bảo chất lượng mà vẫn cạnh tranh về giá. Đa dạng 3 lớp, 5 lớp, 7 lớp, thùng in offset.',
            heroClass: 'blue',
            img: 'images/cat-thung-carton.png'
        }
    };

    var cat = catMap[page];
    if (!cat) {
        // fallback - show all
        cat = { key: 'all', title: 'Tất Cả Sản Phẩm', desc: 'Toàn bộ sản phẩm của Bao Bì Bảo Tín.', heroClass: 'blue', img: '' };
    }

    document.title = cat.title + ' - Bao Bì Bảo Tín';

    var textColor = cat.heroClass === 'blue' ? 'text-white' : '';
    var breadLinkStyle = cat.heroClass === 'blue' ? 'color:rgba(255,255,255,0.7)' : 'color:#0b4a8e';
    var activeStyle = cat.heroClass === 'blue' ? 'color:#fff' : 'color:#555';

    document.getElementById('pageHero').innerHTML = `
        <div class="page-hero ${cat.heroClass} text-center">
            <div class="container">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index.html" style="${breadLinkStyle}">Trang chủ</a></li>
                        <li class="breadcrumb-item active" style="${activeStyle}">${cat.title}</li>
                    </ol>
                </nav>
                <h1 class="${textColor}">${cat.title}</h1>
                <p class="${textColor}">${cat.desc}</p>
            </div>
        </div>`;

    // Filter products
    var products = Object.values(PRODUCTS).filter(function(p){
        return cat.key === 'all' || p.cat === cat.key;
    });

    document.getElementById('productCount').textContent = 'Hiển thị ' + products.length + ' sản phẩm';

    var html = '';
    var cardStyle = cat.heroClass === 'blue' ? '' : 'bordered';
    products.forEach(function(p) {
        html += `
            <div class="col-6 col-md-3 mb-4">
                <div class="product-card ${cardStyle}">
                    <a href="sanpham.html?id=${p.id}"><img src="images/${p.img}" alt="${p.name}" style="height:200px;object-fit:cover;width:100%;"></a>
                    <div class="product-info">
                        <p class="product-name"><a href="sanpham.html?id=${p.id}">${p.name}</a></p>
                        <p class="product-price"><a href="sanpham.html?id=${p.id}"><strong>Liên hệ</strong></a> / Giá</p>
                    </div>
                </div>
            </div>`;
    });
    document.getElementById('productsGrid').innerHTML = html;
})();
</script>
<script src="includes/nav.js"></script>
</body>
</html>
